name: Update TikTok stats

on:
  schedule:
    # Runs once a day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest TikTok stats
        run: node scripts/update-tiktok-stats.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tiktok-stats.json
          git diff --cached --quiet || git commit -m "chore: update TikTok stats"
          git diff --cached --quiet || git push
